name: Generate package lock
on:
  push:
    branches: [chore/generate-package-lock]
    paths:
      - '.github/workflows/generate-package-lock.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/generate-package-lock
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate clean install and application checks
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run typecheck
          npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm package lockfile"
          git push origin chore/generate-package-lock
