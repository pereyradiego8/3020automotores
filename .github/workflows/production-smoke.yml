name: Production smoke checks
on:
  pull_request:
    paths:
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: production-smoke-checks
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public site and security headers
        env:
          BASE_URL: https://3020automotores.vercel.app
        run: |
          node <<'NODE'
          const routes = ['/', '/autos', '/nosotros', '/contacto', '/marcas', '/admin/login'];
          const requiredHeaders = [
            'x-content-type-options',
            'x-frame-options',
            'referrer-policy',
          ];

          async function check(route) {
            const url = new URL(route, process.env.BASE_URL);
            let response;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                response = await fetch(url, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(15000),
                  headers: { 'user-agent': '3020automotores-production-smoke/1.0' },
                });
                if (response.status < 500) break;
              } catch (error) {
                if (attempt === 3) throw error;
              }
              await new Promise(resolve => setTimeout(resolve, attempt * 1000));
            }

            if (!response || response.status !== 200) {
              throw new Error(`${route}: expected HTTP 200, got ${response?.status ?? 'no response'}`);
            }
            const body = await response.text();
            if (body.length < 200) throw new Error(`${route}: response body unexpectedly small (${body.length} bytes)`);

            for (const header of requiredHeaders) {
              if (!response.headers.get(header)) {
                throw new Error(`${route}: missing security header ${header}`);
              }
            }
            console.log(`OK ${route} HTTP ${response.status} (${body.length} bytes)`);
          }

          (async () => {
            let failed = false;
            for (const route of routes) {
              try {
                await check(route);
              } catch (error) {
                failed = true;
                console.error(`FAIL ${route}: ${error.message}`);
              }
            }
            if (failed) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE


      - name: Check health endpoint
        env:
          BASE_URL: https://3020automotores.vercel.app
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch(new URL('/api/health', process.env.BASE_URL), {
              redirect: 'follow',
              signal: AbortSignal.timeout(15000),
              headers: { 'user-agent': '3020automotores-production-smoke/1.0' },
            });
            if (response.status !== 200) {
              throw new Error(`/api/health: expected HTTP 200, got ${response.status}`);
            }
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.toLowerCase().includes('application/json')) {
              throw new Error(`/api/health: expected JSON, got ${contentType || 'no content-type'}`);
            }
            const body = await response.json();
            if (body.status !== 'ok' || Object.keys(body).length !== 1) {
              throw new Error('/api/health returned an unexpected or overly detailed payload');
            }
            console.log('OK /api/health returns HTTP 200 with minimal JSON');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Check robots.txt and sitemap.xml
        env:
          BASE_URL: https://3020automotores.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL;
          async function get(path) {
            const response = await fetch(new URL(path, base), {
              redirect: 'follow',
              signal: AbortSignal.timeout(15000),
              headers: { 'user-agent': '3020automotores-production-smoke/1.0' },
            });
            if (!response.ok) throw new Error(`${path}: expected HTTP 2xx, got ${response.status}`);
            return response.text();
          }
          (async () => {
            const robots = await get('/robots.txt');
            if (!robots.toLowerCase().includes('sitemap: https://3020automotores.vercel.app/sitemap.xml')) {
              throw new Error('robots.txt does not declare the production sitemap URL');
            }
            if (!robots.toLowerCase().includes('disallow: /admin')) {
              throw new Error('robots.txt does not disallow admin paths');
            }
            console.log('OK /robots.txt declares sitemap and disallows admin paths');

            const sitemap = await get('/sitemap.xml');
            if (!sitemap.toLowerCase().includes('<urlset') || !sitemap.includes('<loc>https://3020automotores.vercel.app/')) {
              throw new Error('/sitemap.xml is not a valid-looking sitemap for the production domain');
            }
            console.log('OK /sitemap.xml contains a urlset and production-domain URLs');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
