name: Production smoke checks
on:
  pull_request:
    paths:
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: production-smoke-checks
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public site and security headers
        env:
          BASE_URL: https://3020automotores.vercel.app
        run: |
          node <<'NODE'
          const routes = ['/', '/autos', '/nosotros', '/contacto', '/marcas', '/admin/login'];
          const requiredHeaders = [
            'x-content-type-options',
            'x-frame-options',
            'referrer-policy',
          ];

          async function check(route) {
            const url = new URL(route, process.env.BASE_URL);
            let response;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                response = await fetch(url, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(15000),
                  headers: { 'user-agent': '3020automotores-production-smoke/1.0' },
                });
                if (response.status < 500) break;
              } catch (error) {
                if (attempt === 3) throw error;
              }
              await new Promise(resolve => setTimeout(resolve, attempt * 1000));
            }

            if (!response || response.status !== 200) {
              throw new Error(`${route}: expected HTTP 200, got ${response?.status ?? 'no response'}`);
            }
            const body = await response.text();
            if (body.length < 200) throw new Error(`${route}: response body unexpectedly small (${body.length} bytes)`);

            for (const header of requiredHeaders) {
              if (!response.headers.get(header)) {
                throw new Error(`${route}: missing security header ${header}`);
              }
            }
            console.log(`OK ${route} HTTP ${response.status} (${body.length} bytes)`);
          }

          (async () => {
            let failed = false;
            for (const route of routes) {
              try {
                await check(route);
              } catch (error) {
                failed = true;
                console.error(`FAIL ${route}: ${error.message}`);
              }
            }
            if (failed) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
